version: '3.8'

services:
  focus-warden:
    build: .
    container_name: focus-warden
    environment:
      - DISPLAY=${DISPLAY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Mount X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Optional: Mount for persisting settings
      - ./data:/app/data
    network_mode: host
    # Required for screenshot access
    privileged: true
    restart: unless-stopped
